t": "사내 IT 헬프데스크 에이전트는 한 사용자와 몇 주에 걸쳐 대화하며 장애 이력을 이어서 처리한다. 대화가 길어지자 전체 기록을 매번 컨텍스트에 넣었더니 비용이 늘고, 초기에 확인한 핵심 정보인 사용자 장비 사양을 놓치는 일이 생겼다.", "q": "위 지문에서 이 문제를 개선하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["컨텍스트 한도가 더 큰 모델로 바꿔 몇 주치 대화 전체를 계속 그대로 넣도록 유지한다", "비용을 줄이기 위해 가장 최근 대화 몇 개만 남기고 이전 기록은 모두 버린다", "핵심 사실은 별도 메모리에 구조화해 저장하고, 필요할 때 검색해 불러오게 한다", "사용자에게 매번 대화를 시작할 때 장비 사양을 처음부터 다시 입력하도록 한다"], "answer": 3, "explain": "정답 3: 장비 사양처럼 계속 필요한 핵심 사실을 따로 저장해 두고 필요할 때만 불러오면 컨텍스트가 짧아져 비용이 줄고, 긴 기록 속에 묻혀 놓치는 문제도 해결됩니다. 오답 1: 비용은 오히려 더 늘고, 긴 컨텍스트 속 정보를 놓치는 문제도 해결되지 않습니다. 오답 2: 비용은 줄지만 초기에 확인한 장비 사양 같은 핵심 정보가 사라집니다. 오답 4: 시스템이 해야 할 기억을 사용자에게 떠넘겨 사용 경험을 해칩니다."}, {"kind": "choice", "context": "개발자 B는 공정 표준 문서를 검색해 답하는 사내 질의응답 에이전트를 운영한다. 검색 결과에 관련 문서가 없을 때도 에이전트가 그럴듯한 공정 조건을 지어내 답한 사례가 발견되었다. 현장 엔지니어들은 답변이 어느 문서에서 나왔는지 확인할 방법도 없다고 말한다.", "q": "위 지문에서 개선 방안으로 가장 적절한 것은 무엇인가요?", "options": ["답변을 더 자신감 있는 어조로 쓰도록 해서 현장 사용자의 혼란을 줄이도록 한다", "검색된 문서 근거로만 답하며 출처를 표시하고, 근거가 없으면 모른다고 답한다", "검색 결과가 없을 때는 모델의 일반 지식으로 최대한 답을 채워 넣도록 지시한다", "검색 단계를 없애고 공정 표준 문서 전체를 모델에 미리 학습시켜 답하게 한다"], "answer": 2, "explain": "정답 2: 지문의 문제는 근거 없는 답변과 출처 확인 불가 두 가지입니다. 검색된 문서에 근거해서만 답하고 출처를 함께 보여 주면 사용자가 검증할 수 있고, 근거가 없을 때 모른다고 답하게 하면 지어낸 공정 조건이 현장에 전달되는 것을 막을 수 있습니다. 오답 1: 어조만 바꾸면 틀린 답을 더 믿게 만들어 위험이 커집니다. 오답 3: 지금 발생한 '지어낸 답변' 문제를 오히려 공식화하는 지시입니다. 오답 4: 학습시켜도 출처를 제시하지 못하고, 문서 개정 시 반영이 어려우며 지어낸 답변도 여전히 나올 수 있습니다."}, {"kind": "choice", "context": "회계팀은 매월 같은 순서로 진행되는 정산 작업(파일 다운로드, 형식 변환, 합계 검증, 보고서 업로드)을 자동화하려 한다. 단계와 순서는 매달 바뀌지 않으며, 감사 대응을 위해 매번 같은 방식으로 실행되었음을 보여야 한다. 개발자 B는 LLM 에이전트가 스스로 계획을 세워 처리하게 하는 방안을 검토 중이다.", "q": "위 지문에서 개발자 B가 택할 설계로 가장 적절한 것은 무엇인가요?", "options": ["정해진 단계를 코드로 고정한 워크플로로 만들고, 필요한 단계에만 LLM을 쓴다", "에이전트가 매번 계획을 새로 세우게 해서 상황 변화에 더 유연하게 대응하도록 한다", "여러 에이전트에게 같은 작업을 맡기고 결과가 다수결로 일치하는 쪽을 택한다", "감사 기록은 사람이 따로 작성하고 정산 작업 자체는 에이전트에게 전부 맡긴다"], "answer": 1, "explain": "정답 1: 단계와 순서가 고정되어 있고 매번 같은 방식의 실행을 증명해야 하므로, 흐름은 코드로 고정해 예측 가능하게 만들고 판단이 필요한 부분에만 LLM을 쓰는 것이 적합합니다. 오답 2: 바뀌지 않는 절차에 자율 계획을 쓰면 실행마다 경로가 달라질 수 있어 감사 요건을 충족하기 어렵습니다. 오답 3: 비용과 복잡도만 늘 뿐, 실행 방식의 일관성을 보장하지 못합니다. 오답 4: 실제 실행과 별개로 사람이 작성한 기록은 실행 방식을 증명하지 못합니다."}, {"kind": "choice", "context": "품질 엔지니어 D는 불량 원인 분류 에이전트의 프롬프트를 고쳐 새로 보고된 불량 유형을 잘 처리하게 만들었다. 수정 후 새 유형 사례 몇 건을 직접 확인해 보니 모두 잘 분류되었다. 그런데 이 에이전트는 이미 수십 가지 기존 불량 유형을 처리하고 있다.", "q": "위 지문에서 수정된 프롬프트를 배포하기 전에 할 일로 가장 적절한 것은 무엇인가요?", "options": ["새 유형 사례가 잘 분류되었으므로 우선 배포하고 문제가 생기면 그때 되돌린다", "새 유형 사례를 더 많이 모아 직접 확인하는 건수를 늘린 뒤 배포를 결정한다", "기존 유형을 포함한 평가 세트로 수정 전후를 비교해 성능 저하가 없는지 본다", "기존 유형은 이미 검증을 마쳤으므로 이번 수정의 영향은 없다고 보고 그대로 배포한다"], "answer": 3, "explain": "정답 3: 프롬프트 수정은 새 유형뿐 아니라 기존 유형의 분류에도 영향을 줄 수 있습니다. 기존 유형을 포함한 고정된 평가 세트로 수정 전후를 비교해야 개선과 함께 생긴 성능 저하(회귀)를 배포 전에 잡을 수 있습니다. 오답 1: 기존 유형에서 오분류가 생겨도 발견이 늦어 현장 피해가 먼저 발생할 수 있습니다. 오답 2: 새 유형만 더 확인해서는 기존 유형에 대한 영향을 알 수 없습니다. 오답 4: 이전 검증은 이전 프롬프트에 대한 것이므로 수정 후에는 다시 확인해야 합니다."}, {"kind": "choice", "context": "개발자 B는 매일 밤 사내 수율 조회 API를 도구로 호출해 웨이퍼 불량 리포트를 작성하는 에이전트를 운영한다. 최근 API 담당 팀이 응답 필드명 'defect_rate'를 'defect_ratio'로 바꾼 새 버전을 배포했다. 그 뒤로 에이전트는 오류 없이 정상 종료됐지만, 리포트의 불량률 칸이 모두 '데이터 없음'으로 채워져 며칠 동안 아무도 알아채지 못했다.", "q": "위 지문에서 같은 문제가 재발하지 않도록 하는 대책으로 가장 적절한 것은 무엇인가요?", "options": ["시스템 프롬프트에 필드명이 바뀌면 비슷한 이름의 필드를 찾아 쓰라고 지시한다", "더 큰 모델로 교체해 응답 구조가 바뀌어도 스스로 추론해 처리하도록 한다", "API 응답 원문을 리포트에 그대로 첨부해 담당자가 직접 해석하도록 한다", "도구 API 버전을 고정하고 응답 스키마 검증 실패 시 중단·알림한다"], "answer": 4, "explain": "정답 4: 핵심 문제는 외부 도구가 바뀌었는데도 에이전트가 '조용히 실패'했다는 점입니다. 사용할 API 버전을 고정하면 예고 없는 변경이 들어오지 않고, 도구 응답을 예상 스키마와 대조해 맞지 않으면 실행을 멈추고 알림을 보내면 변경을 즉시 알아챌 수 있습니다. 그다음 새 버전에 맞춰 도구 정의를 검토하고 반영하면 됩니다.\n오답 1: 비슷한 이름을 추측하게 하면 엉뚱한 필드(예: 다른 지표)를 골라도 그대로 진행될 수 있습니다. 실패를 드러내지 못하고 오류를 숨기는 방식이라 오히려 더 위험합니다.\n오답 2: 모델 성능을 높여도 출력이 검증되지 않는다는 구조적 문제는 그대로입니다. 추론 결과가 틀렸을 때 알아챌 장치가 없어 '조용한 실패'를 막지 못합니다.\n오답 3: 자동화의 목적을 잃고 사람에게 해석 부담만 넘깁니다. 이번 사례처럼 이상 징후를 놓치면 여전히 며칠 동안 아무도 모를 수 있습니다."}]}, {"id": "lit-e", "group": "AI 리터러시 문제집", "type": "mcq", "title": "세트 E · AI 기반 데이터 분석·결과 검증", "badge": "객관식 10문항", "timeLimitMin": 15, "aiLimit": {"count": 10, "chars": 1000}, "pii": [], "files": [], "notices": [], "lead": "다음 지문을 읽고 물음에 답하세요.", "passage": "AI 활용·보안·규제 지식을 묻는 시나리오형 객관식입니다. 문항마다 업무 상황을 읽고 가장 적절한 답을 고르세요. (주제: AI 기반 데이터 분석·결과 검증)", "questions": [{"kind": "choice", "context": "품질 엔지니어 D는 30개 로트의 수율 표를 사내 AI 어시스턴트에 붙여 넣고 평균 수율과 합계 불량 수를 요청했다. 답변은 그럴듯했지만 일부 로트를 직접 더해 보니 합계가 맞지 않았다. 이 결과는 주간 품질 회의 보고서에 그대로 들어갈 예정이다.", "q": "위 지문에서 D가 결과의 정확성을 확보하기 위해 취할 조치로 가장 적절한 것은 무엇인가요?", "options": ["프롬프트에 '정확히 계산하라'는 지시를 추가해 같은 질문을 다시 요청한다.", "집계는 코드 실행 도구로 수행하게 하고 원본 데이터로 결과를 재검산한다.", "같은 질문을 여러 번 던져 가장 자주 나온 평균값을 최종 결과로 채택한다.", "차이가 크지 않아 보이므로 보고서에 근사치라는 문구만 덧붙여 제출한다."], "answer": 2, "explain": "언어모델은 문장 생성 방식으로 수치를 다뤄 산술 오류가 날 수 있으므로, 계산은 코드로 실행하고 원본과 재검산해야 한다. 1번: 지시 문구만으로 계산 정확성이 보장되지 않는다. 3번: 다수결은 반복된 오류를 걸러내지 못한다. 4번: 오차 크기를 확인하지 않은 채 검증되지 않은 수치를 보고하는 것이다."}, {"kind": "choice", "context": "구매팀 직원 C는 협력사에서 받은 스캔본 검사성적서 50장을 AI로 판독해 표로 정리했다. 각 성적서 하단에는 항목별 합계가 기재되어 있다. 일부 셀에서 '8'이 '3'으로, 소수점이 빠진 값으로 추출된 사례가 발견되었으며, 이 표는 협력사 품질 평가 점수 산정에 쓰인다.", "q": "위 지문에서 C가 판독 결과를 검증하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["해상도가 낮은 스캔본은 제외하고 판독이 잘 된 문서만 골라 분석에 쓴다.", "다른 생성형 AI로 한 번 더 추출해 두 결과가 같으면 검증 완료로 본다.", "판독 결과를 스프레드시트로 옮기고 서식만 통일해 바로 보고에 사용한다.", "행 합계를 성적서의 합계와 맞춰 보고 불일치 셀은 원본 이미지와 대조한다."], "answer": 4, "explain": "성적서에 기재된 합계와의 정합성 검사로 오류 위치를 찾고, 불일치 셀을 원본 이미지와 직접 대조해야 판독 오류를 바로잡을 수 있다. 1번: 일부 문서를 빼면 평가가 편향되고 데이터가 누락된다. 2번: 두 모델이 같은 글자를 똑같이 잘못 읽을 수 있어 원본 대조를 대신하지 못한다. 3번: 서식 정리로는 값 오류가 고쳐지지 않는다."}, {"kind": "choice", "context": "데이터 분석가 E는 AI에 불량 현황 요약을 맡겼다. AI는 지난달 월간 불량 건수와 이번 주 주간 불량 건수를 나란히 놓고 '불량이 크게 줄었다'고 썼다. 또 불량률이 2%에서 3%로 오른 것을 '1% 상승'이라고 표현했다.", "q": "위 지문에서 E가 요약을 바로잡는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["집계 기간을 같은 단위로 맞춰 비교하고 비율 간 차이는 %p로 표기한다.", "기간 차이는 그대로 두고 불량률 표현만 '50% 상승'으로 고쳐서 쓴다.", "주간·월간 수치를 한 그래프에 함께 그려 전체 추세로만 판단하게 한다.", "집계 기간은 같은 단위로 맞추되 불량률은 '1% 상승' 표기를 유지한다."], "answer": 1, "explain": "기간이 다른 건수를 비교하면 감소처럼 보이는 착시가 생기므로 같은 기간 단위로 맞추고, 비율끼리의 차이는 %p로 표기해야 한다. 2번: 기간 불일치라는 핵심 오류가 그대로 남는다. 3번: 단위가 다른 수치를 한 그래프에 그리면 착시가 더 커진다. 4번: '1% 상승'은 상대 변화율(50%)과 혼동되는 잘못된 표기다."}, {"kind": "choice", "context": "개발자 B는 공정 중간 데이터로 웨이퍼 로트의 최종 테스트 불합격을 예측하는 모델을 만들었다. 피처에는 최종 테스트 이후에 기록되는 '재작업 지시 여부'가 포함되어 있었다. 검증 성능은 매우 높았지만 실제 운영에서는 예측이 거의 맞지 않았다.", "q": "위 지문에서 B가 우선 취해야 할 조치로 가장 적절한 것은 무엇인가요?", "options": ["운영 데이터 전처리 방식을 학습 때와 똑같이 맞추는 작업부터 진행한다.", "모델 복잡도를 낮추고 정규화를 강화해 과적합 문제를 먼저 줄여 본다.", "예측 시점 이후에 기록되는 변수를 피처에서 제외하고 다시 검증한다.", "운영 환경 데이터를 더 모아 학습 데이터 양을 두 배 이상으로 늘린다."], "answer": 3, "explain": "정답과 직결된 미래 정보가 피처에 들어간 타깃 누설이 원인이므로, 예측 시점에 알 수 있는 변수만 남기고 다시 검증해야 한다. 1번: 전처리를 맞춰도 운영 시점에는 해당 변수가 없다. 2번: 원인은 과적합이 아니라 누수다. 4번: 누수 변수가 남아 있으면 데이터를 늘려도 같은 문제가 반복된다."}, {"kind": "choice", "context": "설비 기술팀 분석가 G는 3년치 일별 장비 소모품 사용량으로 수요 예측 모델을 만들었다. 전체 데이터를 무작위로 섞어 8:2로 나눠 검증했고 오차가 매우 작게 나왔다. 하지만 다음 달 실제 예측에서는 오차가 크게 벌어졌다.", "q": "위 지문에서 G가 검증 방식을 개선하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["무작위 분할을 여러 번 반복하는 교차검증으로 평균 성능을 다시 구한다.", "검증 데이터 비율을 20%에서 40%로 늘려 평가를 더 엄격하게 만든다.", "과거 기간으로 학습하고 이후 기간으로 검증하도록 시간 순서로 나눈다.", "날짜 변수를 삭제해 모델이 시간 정보에 의존하지 않도록 다시 학습한다."], "answer": 3, "explain": "무작위로 섞으면 미래 시점 데이터가 학습에 섞여 성능이 부풀려지므로, 실제 사용처럼 시간 순서대로 나눠 검증해야 한다. 1번: 무작위 교차검증도 미래 정보가 섞이는 구조는 같다. 2번: 비율만 바꾸면 분할 방식의 문제가 남는다. 4번: 시계열 예측에 필요한 시간 정보를 버리는 부작용이 있다."}, {"kind": "choice", "context": "검사 자동화팀은 웨이퍼 이미지로 결함을 판별하는 모델을 평가하고 있다. 전체 데이터 중 결함 웨이퍼는 약 1%이며, 모델 정확도는 99%로 보고되었다. 그런데 결과를 확인해 보니 모델이 거의 모든 웨이퍼를 정상으로 판정하고 있었다.", "q": "위 지문에서 팀이 모델 성능을 판단하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["결함 클래스 기준의 정밀도와 재현율을 함께 확인해 성능을 판단한다.", "판정 임계값을 낮춘 뒤 정확도가 99% 이상 유지되는지로 성능을 판단한다.", "정상 데이터를 더 수집해 학습 데이터 규모를 키운 뒤 다시 평가한다.", "정확도 목표치를 99.5%로 높여 모델을 추가로 튜닝하도록 요청한다."], "answer": 1, "explain": "클래스가 불균형하면 모두 정상으로 찍어도 정확도가 높게 나오므로, 결함을 얼마나 잡고 얼마나 맞게 잡는지 정밀도·재현율로 봐야 한다. 2번: 임계값을 바꿔도 판단 기준이 여전히 정확도라 결함 검출력을 확인하지 못한다. 3번: 정상 데이터를 늘리면 불균형이 더 심해진다. 4번: 정확도 목표만 올려서는 지표의 함정을 피하지 못한다."}, {"kind": "choice", "context": "공정 엔지니어 H는 AI 분석 결과를 근거로 '신규 세정 레시피를 적용한 로트의 수율이 더 높다'고 보고하려 한다. 확인해 보니 신규 레시피는 주로 최신 세대 장비에서만 적용되었다. 최신 장비는 원래 구형 장비보다 수율이 높은 편이다.", "q": "위 지문에서 H가 레시피 효과를 올바르게 확인하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["전체 평균 차이가 크므로 신규 레시피를 모든 장비에 즉시 확대 적용한다.", "수율이 낮은 구형 장비 데이터를 이상치로 보고 분석 대상에서 제외한다.", "비교 기간을 늘려 표본 수를 확보한 뒤 전체 평균 차이를 다시 비교한다.", "장비 세대별로 층을 나눠 같은 장비 안에서 레시피 효과를 비교한다."], "answer": 4, "explain": "장비 세대가 레시피 적용과 수율 모두에 영향을 주는 교란 변수이므로, 장비별로 층화해 같은 조건 안에서 비교해야 효과를 분리할 수 있다. 1번: 장비 효과를 레시피 효과로 착각할 수 있다. 2번: 정상 데이터를 임의로 빼면 결과가 왜곡된다. 3번: 표본을 늘려도 전체 평균 비교에는 교란 구조가 그대로 남는다."}, {"kind": "choice", "context": "개발자 B는 사내 챗봇 두 버전의 답변을 LLM 평가자에게 나란히 보여주고 더 나은 쪽을 고르게 했다. 결과를 살펴보니 먼저 제시된 답변과 더 긴 답변이 거의 항상 이겼다. 이 결과로 다음 배포 버전을 결정할 예정이다.", "q": "위 지문에서 B가 평가 결과의 신뢰성을 높이는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["평가 모델을 더 큰 모델로 바꿔 같은 방식으로 한 번 더 평가를 진행한다.", "응답 순서를 바꿔 두 번 평가하고 길이 영향은 사람 평가로 대조한다.", "길게 답한 쪽이 정보가 많으므로 길이를 품질 가점 요소로 명시한다.", "제시 순서는 고정하고 두 답변을 같은 길이로 잘라 맞춘 뒤 재평가한다."], "answer": 2, "explain": "LLM 평가자는 제시 순서와 답변 길이에 끌리는 편향이 있으므로, 순서를 바꿔 결과가 일관한지 확인하고 일부를 사람 평가와 대조해야 한다. 1번: 큰 모델도 같은 편향을 보일 수 있고 방식이 그대로다. 3번: 길이 편향을 오히려 강화한다. 4번: 순서 편향이 남고, 답변을 잘라내면 내용이 훼손된다."}, {"kind": "choice", "context": "경영지원팀 직원 F는 40쪽 분량의 분기 생산 보고서를 AI로 요약해 임원 보고 자료를 만들었다. 요약에는 '전 라인 수율 개선'이라고 적혔지만 원문에는 수율이 떨어진 라인이 하나 있었다. 일부 수치도 원문과 다르게 반올림되어 있었다.", "q": "위 지문에서 F가 요약본을 검증하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["요약 분량을 늘리도록 지시해 원문 내용이 더 많이 담기게 다시 만든다.", "요약본을 다시 AI에 넣어 한 번 더 요약하게 해 핵심 내용만 남긴다.", "원문의 요약 섹션과 AI 요약을 비교해 내용이 일치하면 그대로 배포한다.", "요약에 나온 수치와 예외 사항을 원문 해당 위치와 하나씩 대조한다."], "answer": 4, "explain": "요약은 예외를 일반화하거나 수치를 바꿀 수 있으므로, 수치와 예외 사항을 원문 해당 위치와 직접 대조해야 한다. 1번: 분량을 늘려도 정확성은 보장되지 않는다. 2번: 다시 요약하면 누락이 더 커질 수 있다. 3번: 원문 요약 섹션에도 예외 라인이나 세부 수치가 빠져 있을 수 있어 부분 검증에 그친다."}, {"kind": "choice", "context": "IT기획팀 매니저 J는 신규 AI 업무 도구를 5명에게 2주간 시범 적용했다. 그중 3명의 작업 시간이 줄었고, J는 '생산성 60% 향상 효과 확인'이라고 전사 보고서 초안을 작성했다. 이 보고서는 전사 도입 예산 결정에 쓰인다.", "q": "위 지문에서 J가 결과를 보고하는 방식으로 가장 적절한 것은 무엇인가요?", "options": ["표본 수와 불확실성을 함께 밝히고 더 큰 표본으로 추가 검증한다.", "절감 시간의 중앙값을 구해 그 수치를 전사 도입 효과로 바꿔 보고한다.", "작업 시간이 줄어든 3명의 사용 사례를 인터뷰로 정리해 근거로 붙인다.", "결과를 그래프로 시각화해 효과가 더 분명히 드러나도록 정리한다."], "answer": 1, "explain": "60%는 시간이 줄어든 사람의 비율일 뿐 생산성이 얼마나 올랐는지를 뜻하지 않으며, 5명 중 3명이라는 결과는 우연의 영향이 커서 일반화하기 어려우므로 표본 크기와 불확실성을 밝히고 추가 검증을 거쳐야 한다. 2번: 지표를 바꿔도 5명이라는 소표본의 한계는 그대로다. 3번: 효과가 있었던 사례만 근거로 삼아 결론이 한쪽으로 치우친다. 4번: 시각화로는 표본이 작다는 한계가 해결되지 않는다."}]}, {"id": "lit-e-2", "group": "AI 리터러시 문제집", "type": "mcq", "title": "세트 E-2 · AI 기반 데이터 분석·결과 검증", "badge": "객관식 10문항", "timeLimitMin": 15, "aiLimit": {"count": 10, "chars": 1000}, "pii": [], "files": [], "notices": [], "lead": "다음 지문을 읽고 물음에 답하세요.", "passage": "AI 활용·보안·규제 지식을 묻는 시나리오형 객관식입니다. 문항마다 업무 상황을 읽고 가장 적절한 답을 고르세요. (주제: AI 기반 데이터 분석·결과 검증)", "questions": [{"kind": "choice", "context": "공정 엔지니어 A는 생성형 AI에 신규 식각 레시피 적용 전후의 웨이퍼 불량률 데이터를 주고 효과 분석을 맡겼다. AI는 IQR 기준으로 이상치를 자동 제거한 뒤 \"신규 레시피가 평균 불량률을 18% 낮췄다\"고 보고했다. 원본 데이터를 대조해 보니 제거된 값의 대부분은 신규 레시피를 적용한 뒤 특정 장비 한 대에서 나온 높은 불량률이었다.", "q": "위 지문에서 엔지니어 A가 결론을 보고하기 전에 취할 조치로 가장 적절한 것은 무엇인가요?", "options": ["제거된 값의 발생 원인을 확인하고, 포함·제외 두 경우의 결과를 함께 비교한다", "IQR 대신 표준편차 3배 기준으로 바꿔 이상치를 다시 걸러낸 뒤 결과를 재산출한다", "이상치를 삭제하지 말고 각 그룹의 중앙값으로 대체해 표본 수를 그대로 유지한다", "AI에게 같은 분석을 여러 번 다시 요청해 18% 수치가 일관되게 나오는지 확인한다"], "answer": 1, "explain": "정답 1번: 제거된 값이 신규 레시피 적용 후 특정 장비에 몰려 있으므로 측정 오류가 아니라 레시피와 장비가 맞지 않아 생긴 실제 불량일 수 있다. 이 경우 이상치를 빼면 레시피의 부작용이 가려져 결론이 뒤집힐 수 있다. 따라서 이상치가 생긴 원인을 먼저 확인하고, 이상치를 포함한 결과와 제외한 결과를 함께 제시하는 민감도 분석을 해야 한다. 2번: 이상치를 거르는 통계 기준만 바꾸는 것이다. 값이 실제 현상인지 확인하지 않고 다시 기계적으로 제거하므로 같은 문제가 남는다. 3번: 표본 수는 유지되지만 실제로 높은 불량률을 중앙값으로 덮어써 장비별 문제 신호를 지운다. 왜곡된 결론은 그대로 남는다. 4번: 같은 데이터와 같은 처리 방식으로 반복하면 일관된 결과가 나와도 처리 방식 자체의 오류는 검증되지 않는다. 결과가 일관된지와 결론이 타당한지는 별개의 문제다."}, {"kind": "choice", "context": "데이터 분석가 B는 생성형 AI에 신규 테스트 공정 도입 전후의 칩 테스트 데이터를 주고 개선 여부를 분석하게 했다. AI는 20개 지표에 각각 유의성 검정을 수행한 뒤, 유의수준 0.05에서 유의하게 나온 지표 1개만을 근거로 \"신규 공정이 품질을 개선했다\"고 보고했다. 나머지 19개 지표에서는 유의한 차이가 없었다.", "q": "위 지문에서 분석가 B가 AI의 보고를 검토하며 취할 판단으로 가장 적절한 것은 무엇인가요?", "options": ["유의수준 0.05에서 유의하게 나왔으므로 개선 효과가 통계적으로 입증되었다고 본다", "유의하지 않은 19개 지표는 효과가 없다는 증거이므로 보고서에서 빼고 정리한다", "여러 번 검정하면 우연히 유의한 결과가 나올 수 있어 다중 비교를 보정해 다시 본다", "유의하게 나온 지표 하나의 표본만 더 늘려 다시 검정하면 결론을 확정할 수 있다"], "answer": 3, "explain": "정답 3번: 유의수준 0.05로 20번 검정하면 실제 효과가 없어도 평균 1개 정도는 우연히 유의하게 나올 수 있다. 따라서 검정 횟수를 고려한 다중 비교 보정을 적용하고 전체 지표 결과를 함께 보고 판단해야 한다. 1번: 20번 중 1번 유의한 결과는 우연으로도 충분히 나올 수 있어 효과가 입증되었다고 볼 수 없다. 2번: 유의하지 않다는 것이 효과가 없다는 증거는 아니며, 불리한 결과를 빼면 선택적 보고가 되어 왜곡이 더 커진다. 4번: 이미 결과를 보고 고른 지표만 다시 검정하는 것은 다중 비교 문제를 해결하지 못하고 선택 편향을 그대로 남긴다."}, {"kind": "choice", "context": "품질 엔지니어 D는 생성형 AI에 현재 1년 이상 가동 중인 서버용 메모리 모듈 데이터를 주고 어느 공급사 부품의 내구성이 좋은지 분석하게 했다. AI는 가동 중인 모듈 중 공급사 P 부품 비중이 가장 높다며 P의 내구성이 가장 좋다고 결론 내렸다. 그런데 이 데이터에는 중간에 고장으로 교체된 모듈의 기록이 빠져 있었다.", "q": "위 지문에서 엔지니어 D가 결론을 검토하며 취할 조치로 가장 적절한 것은 무엇인가요?", "options": ["가동 중인 모듈 수가 가장 많은 공급사가 내구성도 좋다는 AI 결론을 그대로 채택한다", "공급사별 가동 모듈 수를 비율로 바꿔 표로 정리하면 편향 없이 비교할 수 있다", "분석 기간을 2년으로 늘리고 가동 중인 모듈만 다시 집계해 결론의 근거를 보강한다", "고장으로 교체된 모듈까지 포함해 공급사별 투입 수 대비 고장 비율을 다시 비교한다"], "answer": 4, "explain": "정답 4번: 현재 살아남은 모듈만 보면 원래 투입량이 많은 공급사가 유리하게 보이는 생존 편향이 생긴다. 내구성은 투입된 전체 모듈 중 고장 난 비율로 비교해야 하므로 교체된 모듈 기록을 포함해 다시 분석해야 한다. 1번: 가동 중인 수가 많은 것은 단지 많이 투입되었기 때문일 수 있어 내구성의 근거가 되지 못한다. 2번: 표현 방식만 비율로 바꿀 뿐 고장 난 모듈이 빠진 데이터 자체의 편향은 그대로 남는다. 3번: 기간을 늘려도 여전히 살아남은 모듈만 집계하므로 같은 생존 편향이 반복된다."}, {"kind": "choice", "context": "개발자 B는 생성형 AI로 설비 센서 로그를 분석하던 중, AI가 값이 비어 있는 행을 모두 삭제하고 분석했다는 것을 알았다. 확인해 보니 센서 값이 빠진 행은 대부분 설비가 과열로 자동 정지하기 직전 구간에 몰려 있었다. AI의 결론은 \"설비 온도는 분석 기간 내내 정상 범위였다\"였다.", "q": "위 지문에서 개발자 B가 취할 조치로 가장 적절한 것은 무엇인가요?", "options": ["결측 행이 전체에서 차지하는 비율이 작다면 삭제해도 결론에 영향이 없으므로 그대로 쓴다", "결측이 특정 상황에 몰린 이유를 확인하고 결측 자체를 이상 신호로 함께 분석한다", "결측값을 전체 평균 온도로 채워 넣어 행 수를 유지한 뒤 같은 분석을 다시 반복한다", "결측 행을 삭제한 대신 남은 데이터의 표본 수가 충분한지만 추가로 확인한다"], "answer": 2, "explain": "정답 2번: 결측이 과열 정지 직전에 몰려 있다면 무작위로 빠진 값이 아니라 이상 상황과 관련된 값이다. 이런 행을 지우면 가장 중요한 구간이 사라져 '항상 정상'이라는 잘못된 결론이 나오므로, 결측의 원인을 확인하고 결측 발생 자체를 분석에 반영해야 한다. 1번: 비율이 작아도 결측이 이상 구간에 몰려 있으면 결론을 크게 바꿀 수 있다. 비율만으로 판단할 수 없다. 3번: 과열 구간을 정상 평균값으로 덮어써 이상 신호를 오히려 지우므로 왜곡이 그대로 남는다. 4번: 표본 수가 충분해도 빠진 행이 특정 상황에 치우쳐 있다는 편향 문제는 해결되지 않는다."}, {"kind": "c p값이 매우 작다는 것은 차이가 크다는 뜻이므로 즉시 라인 조정이 필요하다고 본다", "표본을 무작위로 줄여 다시 검정한 뒤 유의하지 않게 나오면 차이가 없다고 결론짓는다", "표본이 크면 미세한 차이도 유의해지므로 차이의 크기를 규격과 비교해 함께 판단한다", "유의성 검정은 믿기 어려우므로 평균값 비교표만 보고서에 싣고 해석은 생략한다"], "answer": 3, "explain": "정답 3번: p값은 차이가 우연인지에 대한 정보일 뿐 차이가 얼마나 큰지는 알려 주지 않는다. 표본이 매우 크면 실무상 의미 없는 차이도 유의하게 나오므로, 차이의 크기를 규격 허용 범위와 비교해 판단해야 한다. 1번: p값의 크기는 차이의 크기와 다른 개념이므로 p값만으로 조치의 필요성을 판단할 수 없다. 2번: 원하는 결론이 나오도록 표본을 조정하는 것이며, 차이의 실무적 의미를 판단하는 방법이 아니다. 4번: 검정 결과를 버리고 해석까지 생략하면 차이가 실무상 의미 있는지 판단할 근거가 사라진다."}]}, {"id": "lit-f", "group": "AI 리터러시 문제집", "type": "mcq", "title": "세트 F · 생성형 AI 업무 활용 실전", "badge": "객관식 10문항", "timeLimitMin": 15, "aiLimit": {"count": 10, "chars": 1000}, "pii": [], "files": [], "notices": [], "lead": "다음 지문을 읽고 물음에 답하세요.", "passage": "AI 활용·보안·규제 지식을 묻는 시나리오형 객관식입니다. 문항마다 업무 상황을 읽고 가장 적절한 답을 고르세요. (주제: 생성형 AI 업무 활용 실전)", "questions": [{"kind": "choice", "context": "생산기술팀 엔지니어 A는 주간 공정 회의 녹취록을 사내 AI 어시스턴트에 넣고 '요약해 줘'라고만 요청했다. 결과물에 논의 흐름은 잘 정리됐지만 누가 언제까지 무엇을 하기로 했는지가 빠져 있었다. 그 결과 후속 조치가 지연되었다.", "q": "위 지문에서 이 문제를 줄이기 위한 프롬프트 개선으로 가장 적절한 것은 무엇인가요?", "options": ["요약 분량을 늘려 녹취록의 발언을 최대한 빠짐없이 담도록 요청한다.", "결정사항·담당자·기한을 표 항목으로 지정하고 빈 값은 '미정'으로 쓰게 한다.", "회의 참석자 명단을 삭제해 AI가 논의 내용 자체에만 집중하도록 한다.", "같은 요청을 여러 번 반복 실행해 가장 길게 나온 요약본을 채택한다."], "answer": 2, "explain": "원인은 출력 구조를 지정하지 않은 것이므로 결정사항·담당자·기한을 필수 항목으로 지정하고 빈 값을 '미정'으로 드러내게 해야 누락이 보인다. 1: 분량만 늘리면 핵심 항목이 여전히 묻힐 수 있다. 3: 참석자 정보를 지우면 담당자를 특정할 수 없다. 4: 길이는 필수 항목 포함을 보장하지 않는다."}, {"kind": "choice", "context": "해외 고객 대응을 맡은 품질 엔지니어 D는 불량 분석 보고서를 AI로 영문 번역했다. 그런데 사내에서 정해 둔 공정·불량 명칭이 문서마다 다른 영어 단어로 번역되었다. 고객은 같은 불량을 서로 다른 문제로 오해했다.", "q": "위 지문에서 번역 용어를 일관되게 유지하기 위한 방법으로 가장 적절한 것은 무엇인가요?", "options": ["번역 결과가 자연스럽게 읽히도록 AI에게 의역을 최대한 허용하라고 지시한다.", "보고서를 문장 단위로 잘게 나눠 매번 새 대화창에서 따로 번역한다.", "전문 용어는 모두 삭제하고 일반적인 쉬운 표현으로 바꿔서 번역한다.", "사내 용어집을 함께 제공해 지정 대역어를 쓰게 하고 적용 여부를 점검한다."], "answer": 4, "explain": "용어 불일치가 원인이므로 사내 용어집을 제공해 지정 대역어를 쓰게 하고 적용 여부를 확인해야 한다. 1: 의역 허용은 용어 편차를 더 키운다. 2: 대화를 나누면 문장마다 용어가 달라질 가능성이 커진다. 3: 전문 용어를 없애면 기술 문서의 정확성이 훼손된다."}, {"kind": "choice", "context": "기획자 C는 수백 쪽 분량의 제안 요청서를 AI로 요약해야 하는데, 한 번에 넣으면 입력 한도를 넘는다. 그래서 장별로 나눠 요약한 뒤 하나로 합쳤다. 그런데 최종본에서 일부 장의 필수 요구사항이 빠져 있었다.", "q": "위 지문에서 통합 요약의 누락을 줄이기 위한 방법으로 가장 적절한 것은 무엇인가요?", "options": ["통합 단계에서 분량을 줄이도록 앞쪽 장 위주로 핵심만 남기라고 지시한다.", "통합 후 AI에게 누락된 내용이 없는지 스스로 다시 확인해 달라고만 요청한다.", "장별 요약에 장 번호를 붙여 통합하고 원문 목차와 대조해 누락을 점검한다.", "입력 한도에 맞도록 모든 장의 요약 분량을 똑같이 짧게 제한해 합친다."], "answer": 3, "explain": "분할 요약을 통합할 때는 출처(장 번호)를 유지하고 원문 목차와 대조해야 빠진 장을 객관적으로 찾을 수 있다. 1: 앞쪽 장 위주 압축은 뒤쪽 요구사항 누락을 키운다. 2: AI의 자체 확인은 원문 기준 대조가 없어 누락을 놓칠 수 있다. 4: 요구사항이 많은 장까지 같은 분량으로 줄이면 필수 항목이 잘려 나간다."}, {"kind": "choice", "context": "설비 엔지니어 E는 반도체 장비 배관 도면 캡처 이미지를 AI에 올려 밸브 사양과 치수를 표로 정리하게 했다. 결과는 그럴듯했지만 해상도가 낮은 부분의 숫자 일부가 실제 도면과 달랐다.", "q": "위 지문에서 이미지 해석 결과를 활용하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["판독이 불확실한 값은 표시하게 하고, 핵심 치수는 원본 도면과 대조한다.", "해상도를 높여 다시 캡처해 올리고, 결과가 깔끔해 보이면 대조 없이 사용한다.", "같은 이미지를 여러 번 판독시켜 결과가 일치하는 값은 확정값으로 쓴다.", "숫자가 흐릿한 부분은 AI에게 그럴듯한 값으로 추정해 채우도록 지시한다."], "answer": 1, "explain": "이미지 판독은 해상도 등에 따라 오인식이 생길 수 있으므로 불확실한 값을 표시하게 하고 핵심 수치는 원본과 대조해야 한다. 2: 재캡처는 도움이 되지만 결과가 깔끔해 보여도 오인식이 남을 수 있어 대조를 생략하면 안 된다. 3: 같은 오인식이 반복될 수 있어 일치가 정확성을 보장하지 않는다. 4: 추정값 채우기는 오류를 사실처럼 만든다."}, {"kind": "choice", "context": "개발자 B는 사내 AI 어시스턴트로 서버 장애 원인 분석을 진행하던 중 세션이 만료되었다. 이 도구는 새 대화에 이전 대화 내용이 남지 않는다. 그래서 같은 설명을 처음부터 반복하는 일이 잦다.", "q": "위 지문에서 작업을 효율적으로 이어가기 위한 방법으로 가장 적절한 것은 무엇인가요?", "options": ["새 대화에서 '아까 하던 분석을 이어서 해 줘'라고만 짧게 요청한다.", "목표·확인된 사실·남은 과제를 정리한 인계 메모를 새 대화 첫머리에 넣는다.", "이전 대화의 전체 기록을 정리 없이 그대로 복사해 매번 통째로 다시 붙여 넣는다.", "세션이 끊기지 않도록 분석이 끝날 때까지 한 대화창을 계속 열어 둔다."], "answer": 2, "explain": "대화가 이어지지 않는 환경에서는 핵심 상태를 압축한 인계 메모로 맥락을 넘기는 것이 효율적이다. 1: 새 대화는 이전 내용을 모르므로 이어갈 수 없다. 3: 정리 안 된 전체 기록은 입력 한도를 넘거나 핵심을 흐린다. 4: 만료 정책상 세션 유지를 보장할 수 없어 근본 대책이 아니다."}, {"kind": "choice", "context": "인사팀 담당자 F가 쓰는 사내 AI 도구는 입력 글자수 제한이 있다. 길게 쓴 지시문이 잘려 뒷부분의 조건이 반영되지 않았다. 지시문에는 인사말, 배경 설명, 같은 조건의 반복이 많이 섞여 있었다.", "q": "위 지문에서 제한 안에서 지시를 효과적으로 전달하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["모든 조건을 그대로 유지한 채 문장 길이만 줄이고 원래 순서대로 입력한다.", "제한을 넘는 지시는 여러 번 나눠 보내고 조건 간 우선순위는 생략한다.", "인사말과 반복을 빼고 목표·조건·출력 형식을 항목으로 앞쪽에 쓴다.", "배경 설명을 먼저 충분히 쓰고 조건은 남는 글자수 안에서 덧붙여 쓴다."], "answer": 3, "explain": "불필요한 문구와 반복을 제거하고 핵심 지시를 구조화해 앞쪽에 두면 제한 안에서 조건이 온전히 전달된다. 1: 반복 조건이 남고 핵심 조건이 여전히 뒤에 있어 잘릴 위험이 그대로다. 2: 우선순위가 빠지면 조건 충돌 시 엉뚱한 결과가 나온다. 4: 배경을 앞세우면 정작 조건이 잘리는 원인이 반복된다."}, {"kind": "choice", "context": "영업지원팀 G는 AI에게 '다음 달 고객 행사 안내문 만들어 줘'라고만 요청했다. AI는 대상 고객, 일시, 장소를 임의로 가정해 안내문을 작성했다. G는 틀린 정보를 고치느라 오히려 시간을 더 썼다.", "q": "위 지문에서 같은 문제를 예방하기 위한 지시로 가장 적절한 것은 무엇인가요?", "options": ["필요한 정보가 부족하면 작성 전에 확인 질문을 먼저 하도록 지시한다.", "정보가 부족해도 일반적인 행사 기준으로 추정해 완성본을 쓰라고 한다.", "안내문을 여러 버전으로 많이 만들게 한 뒤 맞는 것을 골라서 사용한다.", "AI가 임의로 가정한 내용은 표시 없이 본문에 자연스럽게 녹여 쓰게 한다."], "answer": 1, "explain": "원인은 AI가 빈 정보를 가정으로 채운 것이므로 부족한 정보는 먼저 질문하게 해야 한다. 2: 추정 완성본은 같은 오류를 반복한다. 3: 여러 버전 모두 가정에 기반해 틀릴 수 있고 검토 부담만 늘어난다. 4: 가정을 숨기면 오류 발견이 더 어려워진다."}, {"kind": "choice", "context": "수율 분석 담당자 H는 AI로 월간 웨이퍼 수율 분석 결과를 정리해 임원 보고에 쓰려 했다. 그러나 결과물이 기술 용어가 가득한 긴 서술형이었다. 임원은 핵심을 파악하기 어렵다는 피드백을 주었다.", "q": "위 지문에서 프롬프트를 개선하는 방법으로 가장 적절한 것은 무엇인가요?", "options": ["분석 데이터를 더 많이 입력해 AI가 더 풍부하고 자세한 설명을 쓰게 한다.", "결과물은 그대로 두고 임원에게 기술 용어 해설집을 따로 첨부해 보낸다.", "기술 용어는 유지하되 글자 크기와 줄 간격만 늘려 가독성을 높인다.", "독자를 임원으로 명시하고 결론 우선 3줄 요약과 분량 상한을 지정한다."], "answer": 4, "explain": "대상 독자와 형식·분량을 지정하지 않은 것이 원인이므로 독자, 결론 우선 구조, 분량 상한을 명시해야 한다. 1: 설명이 더 길어져 문제가 악화된다. 2: 읽는 부담을 독자에게 떠넘길 뿐이다. 3: 시각적 조정은 내용 구조 문제를 해결하지 못한다."}, {"kind": "choice", "context": "IT운영팀은 장애 보고서 작성용 프롬프트를 팀원 각자 메신저로 주고받아 쓰고 있다. 누군가 문구를 고친 뒤 결과 품질이 떨어졌다. 그러나 어떤 버전이 언제 왜 바뀌었는지 아무도 알 수 없었다.", "q": "위 지문에서 이 문제를 해결하기 위한 운영 방식으로 가장 적절한 것은 무엇인가요?", "options": ["품질이 떨어질 때마다 각자 원하는 대로 다시 고쳐 쓰고 개인별로 따로 보관한다.", "프롬프트 수정을 전면 금지하고 처음 만든 문구를 계속 고정해서 쓴다.", "공용 저장소에 버전·변경 사유·작성자를 기록하고 이전 버전을 보존한다.", "가장 최근에 메신저로 받은 프롬프트를 항상 최신 정본으로 간주한다."], "answer": 3, "explain": "변경 이력을 추적할 수 없는 것이 원인이므로 공용 저장소에서 버전·사유·작성자를 기록하고 이전 버전으로 되돌릴 수 있어야 한다. 1: 개인별 보관은 버전 파편화를 심화한다. 2: 대로 둔다", "로그 기간을 1주일로 줄여 같은 요청을 다시 하면 결론의 신뢰도가 높아진다고 본다"], "answer": 1, "explain": "정답 1번: 여러 작업을 한 번에 맡기면 중간 과정을 확인할 수 없어 오류가 최종 결론까지 이어진다. 단계를 나누고 각 단계의 결과를 검토하면 오류를 일찍 찾고 결론의 근거를 확인할 수 있다. 2번: 문장을 길게 써도 한 번에 처리하는 구조는 같아 중간 과정을 검토할 수 없다. 3번: 틀린 수치를 바탕으로 결론이 나왔을 수 있어 수치만 고치면 결론의 근거가 맞는지 알 수 없다. 4번: 데이터 범위만 줄이면 분석 근거가 약해지고, 과정을 확인할 수 없는 구조적 문제도 남는다."}]}]</script>
<script>
(() => {
  const ALL = JSON.parse(document.getElementById("problem-data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const md = (s) => {
    try { return DOMPurify.sanitize(marked.parse(String(s || ""), { gfm: true, breaks: true })); }
    catch { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>"); }
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let P, KEY, LIMIT, state;
  const load = (k, d) => store.get(KEY + k, d);
  const save = (k, v) => store.set(KEY + k, v);
  const tokens = (f) => f.tokens || Math.max(1, Math.round(f.content.length / 1.7));

  /* ---------- 이미지 파일(표를 그림으로 렌더) ---------- */
  const imgCache = {};
  function drawTable(spec) {
    const split = spec.split || 1, cols = spec.columns, rows = spec.rows;
    const per = Math.ceil(rows.length / split), rowH = 26, pad = 36, font = '"IBM Plex Sans KR","Malgun Gothic",sans-serif';
    const c0 = document.createElement("canvas").getContext("2d");
    c0.font = `13px ${font}`;
    const colW = cols.map((h, i) => Math.ceil(Math.max(c0.measureText(h).width, ...rows.map((r) => c0.measureText(r[i]).width)) + 22));
    const tW = colW.reduce((a, b) => a + b, 0), gap = 10;
    const W = Math.max(pad * 2 + tW * split + gap * (split - 1), 560), H = 120 + rowH * (per + 1) + pad;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#1f3b63"; g.font = `600 22px ${font}`; g.textAlign = "center"; g.fillText(spec.title, W / 2, 52);
    g.fillStyle = "#555"; g.font = `12px ${font}`; g.fillText(spec.subtitle || "", W / 2, 80);
    const x0 = (W - (tW * split + gap * (split - 1))) / 2;
    for (let s = 0; s < split; s++) {
      const part = rows.slice(s * per, (s + 1) * per), bx = x0 + s * (tW + gap), by = 100;
      g.fillStyle = "#2f5d9e"; g.fillRect(bx, by, tW, rowH);
      g.font = `600 12px ${font}`; g.fillStyle = "#fff"; g.textAlign = "center";
      let x = bx; cols.forEach((h, i) => { g.fillText(h, x + colW[i] / 2, by + 17); x += colW[i]; });
      g.font = `13px ${font}`; g.textAlign = "left";
      part.forEach((r, ri) => {
        const y = by + rowH * (ri + 1);
        g.fillStyle = ri % 2 ? "#f3f6fa" : "#fff"; g.fillRect(bx, y, tW, rowH);
        g.fillStyle = "#222"; let xx = bx; r.forEach((v, i) => { g.fillText(v, xx + 10, y + 18); xx += colW[i]; });
      });
      g.strokeStyle = "#9fb3cc"; g.lineWidth = 1;
      for (let i = 0; i <= part.length + 1; i++) { g.beginPath(); g.moveTo(bx, by + rowH * i + .5); g.lineTo(bx + tW, by + rowH * i + .5); g.stroke(); }
      let xl = bx; [0, ...colW].forEach((w) => { xl += w; g.beginPath(); g.moveTo(xl + .5, by); g.lineTo(xl + .5, by + rowH * (part.length + 1)); g.stroke(); });
    }
    return cv;
  }
  async function fileImage(f) {
    if (imgCache[f.name]) return imgCache[f.name];
    try { await document.fonts.ready; } catch {}
    const cv = drawTable(f.image);
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    return (imgCache[f.name] = { url: cv.toDataURL("image/png"), blob, w: cv.width });
  }

  /* ---------- PII ---------- */
  const PII_RE = [/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, /01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/g];
  function findPII(text) {
    if (P.pii == null) return [];
    const hits = new Set();
    for (const p of P.pii) if (p && p.length > 1 && text.includes(p)) hits.add(p);
    if (P.pii.length) for (const re of PII_RE) for (const m of text.matchAll(re)) hits.add(m[0]);
    return [...hits];
  }

  /* ---------- 문제 표시 ---------- */
  function renderProblem() {
    $("probTitle").textContent = P.title;
    document.title = "AX 해커톤 연습실";
    const meta = `<div class="problem-meta"><span class="chip accent">${esc(P.badge)}</span><span class="chip">연습용</span><span class="chip mono">제한 ${P.timeLimitMin}분</span><span class="chip mono">AI ${LIMIT.count}회 · ${LIMIT.chars}자</span></div>`;
    if (P.type === "mcq") {
      $("problem").innerHTML = `${meta}
        <div class="mcq-head"><span class="range">1~${P.questions.length}</span>${esc(P.lead || "다음을 읽고 문제를 풀어주세요.")}</div>
        <div class="md">${md(P.passage)}</div>
        <div class="prob-block"><h3>주의사항</h3><div class="md"><ul>${P.notices.map((n) => `<li>${md(n).replace(/^<p>|<\/p>\s*$/g, "")}</li>`).join("")}</ul></div></div>`;
    } else {
      $("problem").innerHTML = `${meta}
        <h1 style="font-size:20px;margin-bottom:14px">${esc(P.title)}</h1>
        <details class="guide" open><summary>평가 가이드라인</summary><div class="md">${md(P.guideline)}</div></details>
        <div class="prob-block"><h3>과제 상황</h3><div class="md">${md(P.situation)}</div></div>
        <div class="prob-block"><h3>보고서 필수 포함 섹션</h3><ol class="sections">${P.sections.map((s) => `<li><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></li>`).join("")}</ol></div>
        <div class="prob-block"><h3>유의사항 (보안 및 개인정보 처리)</h3><div class="md"><ul>${P.notices.map((n) => `<li>${md(n).replace(/^<p>|<\/p>\s*$/g, "")}</li>`).join("")}</ul></div></div>`;
    }
    $("filesPanel").hidden = !P.files.length;
    $("attach").hidden = !P.files.length;
    $("essayPanel").hidden = P.type === "mcq";
    $("mcqPanel").hidden = P.type !== "mcq";
    $("filesHint").textContent = P.type === "mcq" ? "이미지 파일은 확대해서 확인" : "행·페이지 번호를 근거로 인용";
    $("aiRule").textContent = `질문 1회 ${LIMIT.chars.toLocaleString()}자 이내 · 매 질문은 새 대화`;
    $("prompt").maxLength = LIMIT.chars;
    $("prompt").placeholder = P.pii && P.pii.length ? "첨부 파일과 함께 보낼 지시를 입력하세요. 이름·사번·이메일 등 개인정보는 입력하지 마세요." : "첨부 파일과 함께 보낼 지시를 입력하세요.";
  }

  /* ---------- 파일 ---------- */
  function parseCSV(s) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) { if (c === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && s[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter((r) => r.some((x) => x !== ""));
  }
  function grouped(render, folderRow) {
    let prev = null, out = "";
    P.files.forEach((f, i) => {
      if ((f.folder || null) !== prev) { prev = f.folder || null; if (prev) out += folderRow(prev); }
      out += render(f, i);
    });
    return out;
  }
  function renderFileList() {
    $("fileCount").textContent = P.files.length + "개";
    $("fileList").innerHTML = grouped(
      (f, i) => `<li${f.folder ? ' class="in-folder"' : ""}><button type="button" data-i="${i}" aria-current="${i === state.current}" title="${esc(f.name)}"><span class="fname">${esc(f.name)}${state.attached.has(f.name) ? '<span class="att">● 첨부</span>' : ""}</span><span class="ftok">${tokens(f).toLocaleString()}</span></button></li>`,
      (d) => `<li class="folder">📁 ${esc(d)}</li>`);
  }
  async function renderViewer() {
    const f = P.files[state.current];
    if (!f) return;
    $("vName").textContent = f.name;
    $("vTok").textContent = tokens(f).toLocaleString() + " 토큰";
    $("vAttach").textContent = state.attached.has(f.name) ? "첨부 해제" : "AI에 첨부";
    $("vAttach").classList.toggle("primary", !state.attached.has(f.name));
    $("zoomBox").hidden = f.kind !== "image";
    const body = $("vBody");
    body.scrollTop = 0;
    if (f.kind === "image") {
      body.innerHTML = '<div class="img-wrap"><span class="ai-empty">이미지 준비 중…</span></div>';
      const im = await fileImage(f);
      if (P.files[state.current] !== f) return;
      const z = state.zoom[f.name] || 0.8;
      $("zoomVal").textContent = Math.round(z * 100) + "%";
      body.innerHTML = `<div class="img-wrap"><img src="${im.url}" alt="${esc(f.name)} 내용(표 이미지)" width="${Math.round(im.w * z)}"></div>`;
    } else if (f.kind === "csv") {
      const [h, ...data] = parseCSV(f.content);
      body.innerHTML = `<table class="csv"><thead><tr><th class="rn">행</th>${h.map((x) => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${data.map((r, i) => `<tr><td class="rn">${i + 1}</td>${r.map((x) => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    } else if (f.kind === "pdf") {
      const parts = f.content.split(/(?=\[p\.\d+\])/).map((s) => s.trim()).filter(Boolean);
      body.innerHTML = `<div class="doc">${parts.map((p) => { const m = p.match(/^\[p\.(\d+)\]\s*/); return `<div class="page"><div class="pno">${m ? "p." + m[1] : ""}</div><pre>${esc(m ? p.slice(m[0].length) : p)}</pre></div>`; }).join("")}</div>`;
    } else {
      body.innerHTML = `<div class="log">${f.content.split("\n").map((l, i) => `<div class="ln"><span>${i + 1}</span><span>${esc(l) || " "}</span></div>`).join("")}</div>`;
    }
  }
  function zoom(d) {
    const f = P.files[state.current];
    state.zoom[f.name] = Math.min(2, Math.max(0.4, (state.zoom[f.name] || 0.8) + d));
    renderViewer();
  }
  $("zoomIn").onclick = () => zoom(0.1);
  $("zoomOut").onclick = () => zoom(-0.1);
  $("fileList").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    state.current = +b.dataset.i; renderFileList(); renderViewer();
  });
  function toggleAttach(name) {
    state.attached.has(name) ? state.attached.delete(name) : state.attached.add(name);
    save("attached", [...state.attached]); renderFileList(); renderViewer(); renderAttach();
  }
  $("vAttach").onclick = () => toggleAttach(P.files[state.current].name);

  /* ---------- 서술형 답안 ---------- */
  const ans = $("answer");
  let saveT;
  function onAnswer() {
    $("ansCount").textContent = ans.value.length.toLocaleString() + " 자 (공백 포함)";

    if ($("editorBody").classList.contains("split")) $("preview").innerHTML = md(ans.value);
  }
  ans.addEventListener("input", () => { onAnswer(); clearTimeout(saveT); saveT = setTimeout(() => save("answer", ans.value), 400); });
  $("togglePreview").onclick = (e) => {

    e.currentTarget.textContent = on ? "미리보기 끄기" : "미리보기 켜기";
    e.currentTarget.setAttribute("aria-pressed", on);
    onAnswer();
  };

  /* ---------- 객관식 ---------- */
  const norm = (s) => String(s ?? "").replace(/[\s,$]/g, "").toUpperCase();
  const isRight = (q, v) => (q.kind === "short" ? (q.accept || [q.answer]).map(norm).includes(norm(v)) && norm(v) !== "" : v === q.answer);
  function renderMCQ() {
    const m = state.mcq, done = m.submitted;
    $("qlist").innerHTML = P.questions.map((q, i) => {
      const pick = m.choices[i], ok = isRight(q, pick);
      if (q.kind === "short") return `<div class="qitem" id="q-${i}">
        <div class="qitem-head"><b>${i + 1}. 주관식</b>
          <button class="btn sm flag" type="button" data-flag="${i}" aria-pressed="${!!m.flags[i]}">다시 풀 문제 ⚑</button>
          <button class="btn sm" type="button" data-top="1">지문으로 이동 ↑</button>
          ${done ? `<span class="chip ${ok ? "ok" : "warn"}">${ok ? "○ 정답" : pick ? "✕ 오답" : "미응답"}</span>` : ""}

        ${done ? `<div class="explain"><b>해설</b> · 정답 ${esc(q.answer)}. ${esc(q.explain)}</div>` : ""}
      </div>`;
      return `<div class="qitem" id="q-${i}">
        <div class="qitem-head"><b>${i + 1}. 객관식</b>
          <button class="btn sm flag" type="button" data-flag="${i}" aria-pressed="${!!m.flags[i]}">다시 풀 문제 ⚑</button>
          <button class="btn sm" type="button" data-top="1">지문으로 이동 ↑</button>
          ${done ? `<span class="chip ${ok ? "ok" : "warn"}">${ok ? "○ 정답" : pick ? "✕ 오답" : "미응답"}</span>` : ""}
        </div>
        ${q.context ? `<div>다음 지문을 읽고 물음에 답하세요.</div><blockquote class="ctx">${esc(q.context)}</blockquote>` : ""}
        <div>${esc(q.q)}</div>
        <div class="hint">답안을 선택하세요 ↴</div>
        <ul class="opts" role="radiogroup" aria-label="${i + 1}번 보기">${q.options.map((o, j) => {
          const n = j + 1, cls = done ? (n === q.answer ? "correct" : pick === n ? "wrong" : "") : "";
          return `<li><label class="${cls}"><input type="radio" name="q${i}" value="${n}" ${pick === n ? "checked" : ""} ${done ? "disabled" : ""}><span class="num">${n}</span>${esc(o)}</label></li>`;
        }).join("")}</ul>
        ${done ? `<div class="explain"><b>해설</b> · 정답 ${q.answer}번. ${esc(q.explain)}</div>` : ""}
      </div>`;
    }).join("");
  }
  $("qlist").addEventListener("change", (e) => {
    const m = e.target.name?.match(/^q(\d+)$/); if (!m) return;
    state.mcq.choices[+m[1]] = +e.target.value; save("mcq", state.mcq);
  });
  $("qlist").addEventListener("input", (e) => {
    const i = e.target.dataset?.short; if (i == null) return;
    state.mcq.choices[+i] = e.target.value; save("mcq", state.mcq);
  });
  $("qlist").addEventListener("click", (e) => {
    const f = e.target.closest("[data-flag]");
    if (f) { const i = +f.dataset.flag; state.mcq.flags[i] = !state.mcq.flags[i]; save("mcq", state.mcq); f.setAttribute("aria-pressed", state.mcq.flags[i]); }
    if (e.target.closest("[data-top]")) $("problem").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  function gradeMCQ() {
    state.mcq.submitted = true; save("mcq", state.mcq); renderMCQ();
    const right = P.questions.filter((q, i) => isRight(q, state.mcq.choices[i])).length;
    $("resultPanel").hidden = false;
    $("regradeBtn").textContent = "AI 사용 피드백";
    $("result").innerHTML = `<div class="scores"><div class="score"><div class="label">정답 수</div><div class="v">${right}<small>/${P.questions.length}</small></div></div><div class="score"><div class="label">AI 사용</div><div class="v">${used()}<small>/${LIMIT.count}회</small></div></div></div>
      <p class="ai-empty" id="mcqFb">문항별 해설은 각 문제 아래에 표시됩니다. 'AI 사용 피드백'을 누르면 이번 풀이의 질문 기록을 평가받을 수 있습니다.</p>`;
  }
  async function mcqFeedback() {
    if (!sample) return;
    const box = $("mcqFb"); if (!box) return;
    if (!state.log.length) { box.textContent = "AI 질문 기록이 없습니다."; return; }
    box.textContent = "평가 중…";
    const log = state.log.filter((t) => !t.error).map((t, i) => ({ no: i + 1, files: t.files, prompt: t.prompt, answer: (t.answer || "").slice(0, 600) }));
    try {
      const { text } = await sample(`너는 AI 활용 역량 코치다. 응시자가 아래 객관식 문제를 풀며 AI에게 한 질문 기록을 평가하라. 기준: 자료 선별(필요 파일만 첨부), 지시의 정확성(규칙·조건 명시, 출력 형식), AI 결과 검증(원자료 대조·재확인 요청), 횟수 효율. 질문마다 한 줄 평가와 더 나은 질문 예시를 주고, 마지막에 총평 3줄. 마크다운, 한국어.\n[문제]\n${P.passage}\n주의사항: ${P.notices.join(" ")}\n문항: ${P.questions.map((q, i) => `${i + 1}. ${q.q}`).join(" / ")}\n[정답] ${P.questions.map((q) => q.answer).join(", ")}\n[응시자 답] ${P.questions.map((q, i) => state.mcq.choices[i] || "-").join(", ")}\n[질문 기록]\n${JSON.stringify(log)}`, { cache: false });
      box.className = "md"; box.innerHTML = md(text);
    } catch (e) { box.textContent = "피드백을 받지 못했습니다 (" + e.code + ")."; }
  }

  /* ---------- 타이머 ---------- */
  function tick() {
    if (!P) return;
    const left = P.timeLimitMin * 60000 - (Date.now() - state.startedAt);
    const s = Math.max(0, Math.floor(left / 1000));
    $("timer").textContent = left <= 0 ? "시간 종료" : String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    $("timer").parentElement.classList.toggle("low", left < Math.min(10, P.timeLimitMin / 4) * 60000);
  }
  setInterval(tick, 1000);

  /* ---------- AI 어시스턴트 ---------- */
  let sample = null, imagesOK = false, ctl = null, busy = false;
  const used = () => state.log.filter((t) => !t.error).length;
  function renderLeft() {
    const left = Math.max(0, LIMIT.count - used());
    $("aiLeft").textContent = "남은 " + left + "회";
    $("aiLeftTop").textContent = left + "/" + LIMIT.count;
    $("aiStat").classList.toggle("low", left <= 2);
    $("sendBtn").disabled = busy || !sample || left <= 0;
    $("submitBtn").disabled = !sample && P.type !== "mcq";
  }
  const attachLimit = () => +$("attachLimit").value;
  const attachedTokens = () => P.files.filter((f) => state.attached.has(f.name)).reduce((s, f) => s + tokens(f), 0);
  function renderAttach() {
    const names = [...state.attached], tok = attachedTokens(), lim = attachLimit();
    $("attachChips").innerHTML = (!names.length ? '<span class="chip">없음 — 눌러서 선택</span>'
      : names.length > 3 ? names.slice(0, 2).map((n) => `<span class="chip">${esc(n)}</span>`).join(" ") + ` <span class="chip accent">외 ${names.length - 2}개</span>`
      : names.map((n) => `<span class="chip">${esc(n)}</span>`).join(" "))
      + (names.length ? ` <span class="chip mono ${lim && tok > lim ? "warn" : ""}">${tok.toLocaleString()}${lim ? " / " + lim.toLocaleString() : ""} 토큰</span>` : "");
    $("attachPick").innerHTML = grouped(
      (f) => `<label${f.folder ? ' class="in-folder"' : ""}><input type="checkbox" data-n="${esc(f.name)}" ${state.attached.has(f.name) ? "checked" : ""}> ${esc(f.name)}<span class="ftok">${tokens(f).toLocaleString()}</span></label>`,
      (d) => { const fs = P.files.filter((f) => f.folder === d); return `<label class="folder"><input type="checkbox" data-folder="${esc(d)}" ${fs.every((f) => state.attached.has(f.name)) ? "checked" : ""}> 📁 ${esc(d)} (전체 ${fs.length}개)</label>`; });
    const hasImg = P.files.some((f) => f.kind === "image");
    $("imgNote").textContent = !hasImg ? "" : imagesOK ? "이미지 파일은 그림으로 전송" : "이미지 전송 불가 → 표 내용을 텍스트로 전송";
  }
  $("attachLimit").value = String(store.get("axlab:attachLimit", 20000));
  $("attachLimit").onchange = () => { store.set("axlab:attachLimit", attachLimit()); renderAttach(); };
  $("attachPick").addEventListener("change", (e) => {
    const d = e.target.dataset;
    if (d.n) toggleAttach(d.n);
    if (d.folder) {
      P.files.filter((f) => f.folder === d.folder).forEach((f) => (e.target.checked ? state.attached.add(f.name) : state.attached.delete(f.name)));
      save("attached", [...state.attached]); renderFileList(); renderViewer(); renderAttach();
    }
    $("attach").open = true;
  });

  function renderLog() {
    const box = $("aiLog");
    if (!state.log.length) {
      box.innerHTML = `<div class="ai-empty">아직 질문이 없습니다. 이렇게 시작해 보세요.<ul><li>목적에 맞는 파일만 골라 📎 첨부</li><li>역할·작업·출력 형식·근거 위치를 지시</li><li>규칙(예: 마지막 주문만 유효)을 질문에 명시</li><li>AI 답은 원자료와 대조해 검증</li></ul></div>`;
      return;
    }
    box.innerHTML = state.log.map((t, i) => `
      <div class="turn">
        <div class="q"><div class="q-meta"><b class="mono">Q${i + 1}</b><span class="mono">${t.prompt.length}자</span>${t.files.length ? `<span>📎 ${t.files.map(esc).join(", ")}</span>` : "<span>첨부 없음</span>"}${t.pii.length ? `<span class="chip warn">개인정보 입력 ${t.pii.length}건</span>` : ""}${t.memory ? '<span class="chip">기억 켬</span>' : ""}</div><pre>${esc(t.prompt)}</pre></div>
        <div class="a ${t.error ? "err" : ""}"><div class="a-meta"><span>AI 응답${t.model ? " · " + esc(t.model) : ""}</span>${t.truncated ? '<span class="chip warn">잘림</span>' : ""}<span style="flex:1"></span>${t.answer ? `<button class="btn sm" type="button" data-copy="${i}">복사</button>` : ""}</div><div class="md" id="ans-${i}">${t.error ? esc(t.error) : md(t.answer || "생각 중…")}</div></div>
      </div>`).join("");
    box.scrollTop = box.scrollHeight;
  }
  $("aiLog").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    const text = state.log[+b.dataset.copy].answer;
    try { await navigator.clipboard.writeText(text); b.textContent = "복사됨"; }
    catch { const r = document.createRange(); r.selectNodeContents($("ans-" + b.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "선택됨 · Ctrl+C"; }
    setTimeout(() => (b.textContent = "복사"), 1500);
  });

  const prompt = $("prompt");
  function onPrompt() {
    const n = prompt.value.length;
    $("promptCount").textContent = n + " / " + LIMIT.chars;
    $("promptCount").classList.toggle("over", n > LIMIT.chars);
    $("piiWarn").hidden = true;
  }
  prompt.addEventListener("input", () => { onPrompt(); save("draft", prompt.value); });

  async function buildInput(text, files) {
    const parts = ["너는 사용자를 돕는 AI 어시스턴트다. 사용자가 첨부한 파일과 질문만 보고 한국어로 답하라. 첨부되지 않은 파일의 내용은 알 수 없으니 추측하지 말라. 마크다운으로 답하라."];
    const images = [];
    if (files.length) {
      parts.push("[첨부 파일]");
      for (const n of files) {
        const f = P.files.find((x) => x.name === n);
        if (f.kind === "image" && imagesOK) { images.push((await fileImage(f)).blob); parts.push(`=== ${f.name} (이미지 ${images.length}번째로 첨부) ===`); }
        else if (f.kind === "image") parts.push(`=== ${f.name} (원본은 이미지, 표 내용을 텍스트로 옮김) ===\n${f.content}`);
        else parts.push(`=== ${f.name} (${f.kind === "csv" ? "CSV, 첫 줄은 헤더이며 헤더 다음 줄이 1행" : f.kind === "pdf" ? "PDF 문서, [p.N]은 페이지" : "텍스트, 줄 번호는 1부터"}) ===\n${f.content}`);
      }
    } else parts.push("[첨부 파일 없음]");
    parts.push("[질문]\n" + text);
    const cur = parts.join("\n\n");
    if (!$("memory").checked) return { input: cur, images };
    const turns = [];
    for (const t of state.log.slice(-4)) if (!t.error && t.answer) turns.push({ role: "user", content: t.prompt }, { role: "assistant", content: t.answer });
    turns.push({ role: "user", content: cur });
    return { input: turns, images };
  }

  async function send(force) {
    const text = prompt.value.trim();
    if (!text || busy || !sample || text.length > LIMIT.chars || used() >= LIMIT.count) return;
    const tok = attachedTokens(), lim = attachLimit();
    if (lim && tok > lim) {
      $("piiWarn").hidden = false;
      $("piiWarn").innerHTML = `<b>첨부 파일이 ${tok.toLocaleString()} 토큰으로 한도(${lim.toLocaleString()})를 넘습니다.</b><span>필요한 파일만 남기거나 질문을 나눠 보내세요.</span>`;
      return;
    }
    const pii = findPII(text);
    if (pii.length && !force) {
      $("piiWarn").hidden = false;
      $("piiWarn").innerHTML = `<b>개인정보로 보이는 값이 있습니다: ${pii.map(esc).join(", ")}</b><span>실전에서는 보안 통제 감점 요소입니다. [작업자1] 같은 가명으로 바꿔 보내세요.</span><div class="row"><button class="btn sm" type="button" id="piiFix">수정하기</button><button class="btn sm" type="button" id="piiForce">그대로 보내기(기록됨)</button></div>`;
      $("piiFix").onclick = () => { $("piiWarn").hidden = true; prompt.focus(); };
      $("piiForce").onclick = () => send(true);
      return;
    }
    $("piiWarn").hidden = true;
    const files = [...state.attached], log = state.log, key = KEY;
    const turn = { prompt: text, files, pii, memory: $("memory").checked, answer: "", at: Date.now() };
    log.push(turn);
    const idx = log.length - 1;
    busy = true; renderLeft(); renderLog();
    $("stopBtn").hidden = false;
    prompt.value = ""; save("draft", ""); onPrompt();
    ctl = new AbortController();
    try {
      const { input, images } = await buildInput(text, files);
      const res = await sample(input, {
        signal: ctl.signal, cache: false, ...(images.length ? { images } : {}),
        ...($("lite").checked ? { modelTier: "quick" } : { model: "claude-sonnet-5-5", modelTier: "default" }),
        onText: ({ text: t }) => { turn.answer = t; const el = key === KEY && $("ans-" + idx); if (el) el.innerHTML = md(t); },
      });
      turn.answer = res.text; turn.truncated = res.truncated;
      turn.model = res.modelApplied === "claude-sonnet-5-5" ? "Sonnet 5.5" : { quick: "경량", default: "기본", complex: "고성능" }[res.modelTierApplied] || "";
    } catch (e) {
      if (e.text) turn.answer = e.text;
      else {
        turn.error = e.code === "cancelled" ? "중지됨 (횟수 차감 안 됨)" : e.code === "not_granted" ? "AI 사용 권한이 거부되었습니다." : e.code === "rate_limited" ? "요청이 많습니다. 잠시 후 다시 보내세요 (횟수 차감 안 됨)." : "응답을 받지 못했습니다 (" + e.code + "). 다시 보내세요 — 횟수는 차감되지 않습니다.";
        if (e.code !== "cancelled" && key === KEY) prompt.value = text;
      }
      if (e.code === "not_granted" || e.code === "sampling_disabled") disableAI("AI 사용이 허용되지 않아 질문할 수 없습니다.");
    } finally {
      busy = false; $("stopBtn").hidden = true;
      store.set(key + "log", log);
      if (key === KEY) renderLog();
      renderLeft();
    }
  }
  $("sendBtn").onclick = () => send(false);
  $("stopBtn").onclick = () => ctl?.abort();
  prompt.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(false); });
  function disableAI(msg) { $("aiOff").hidden = false; $("aiOff").textContent = msg; $("sendBtn").disabled = true; }

  /* ---------- 서술형 채점 ---------- */
  function gradeInput() {
    const ansPII = findPII(ans.value);
    const log = state.log.filter((t) => !t.error).map((t, i) => ({ no: i + 1, chars: t.prompt.length, attachedFiles: t.files, piiInPrompt: t.pii, prompt: t.prompt, aiAnswerExcerpt: (t.answer || "").slice(0, 700) }));
    return `너는 기업 AI 역량평가 채점위원이다. 아래 문제·정답키·루브릭으로 응시자 답안(결과)과 프롬프트 기록(과정)을 엄격하게 채점하라.
채점 원칙:
- 결과: 정답키의 근본원인·핵심 수치·함정 판별과 일치하는지, 근거 위치(파일명+행/페이지/줄) 인용이 실제로 맞는지, 필수 섹션을 모두 갖췄는지. 근거 없는 단정, 상관을 인과로 쓴 서술, 시점 오류는 감점.
- 과정: 프롬프트마다 자료 선별(첨부 파일이 목적에 맞는지), 지시의 정교함(역할·작업·형식·인용 요구), AI 결과 비판적 검증(재계산·교차검증 요청), 보안 통제(프롬프트에 개인정보 입력 여부, 답안의 개인정보 노출). 프롬프트에 개인정보가 들어간 경우 반드시 감점. 사용 횟수 ${LIMIT.count}회 중 ${log.length}회 사용.
- 루브릭 항목별 배점 그대로 점수를 매기고, 각 항목에 구체적 근거(답안 문장·프롬프트 번호)를 들어 코멘트.
- 답안이 비어 있거나 매우 짧으면 결과 점수는 낮게.

반드시 아래 JSON 하나만 출력:
{"result":{"score":number,"max":60,"items":[{"item":string,"max":number,"score":number,"comment":string}]},"process":{"score":number,"max":40,"items":[{"item":string,"max":number,"score":number,"comment":string}]},"summary":string,"strengths":[string],"improvements":[string],"promptReviews":[{"no":number,"comment":string,"better":string}]}
promptReviews.better는 그 프롬프트를 개선한 예시(${LIMIT.chars}자 이내).

[문제]
${P.title}
${P.situation}
필수 섹션: ${P.sections.map((s, i) => i + 1 + ". " + s.title).join(" / ")}

[정답키]
${JSON.stringify(P.answerKey)}

[루브릭]
${JSON.stringify(P.rubric)}

[답안 내 개인정보 탐지 결과(페이지 자동 탐지)]
${ansPII.length ? ansPII.join(", ") : "없음"}

[프롬프트 기록]
${JSON.stringify(log)}

[응시자 답안]
${ans.value.slice(0, 30000) || "(빈 답안)"}`;
  }
  function renderGrade(g) {
    $("resultPanel").hidden = false;
    $("regradeBtn").textContent = "다시 채점";
    const r = $("result");
    if (!g) { r.innerHTML = '<p class="ai-empty">채점 중… 답안과 프롬프트 기록을 함께 평가하고 있습니다. 1~2분 걸릴 수 있습니다.</p>'; return; }
    if (g.error) { r.innerHTML = `<p style="color:var(--warn)">${esc(g.error)}</p>`; return; }
    const rows = (sec) => (sec?.items || []).map((x) => `<tr><td>${esc(x.item)}</td><td class="num">${x.score}/${x.max}</td><td>${esc(x.comment)}</td></tr>`).join("");
    const K = P.answerKey;
    r.innerHTML = `
      <div class="scores">
        <div class="score"><div class="label">총점</div><div class="v">${(g.result?.score || 0) + (g.process?.score || 0)}<small>/100</small></div></div>
        <div class="score"><div class="label">결과 평가</div><div class="v">${g.result?.score ?? "-"}<small>/60</small></div></div>
        <div class="score"><div class="label">과정 평가</div><div class="v">${g.process?.score ?? "-"}<small>/40</small></div></div>
      </div>
      <div class="md" style="max-width:none">${md(g.summary || "")}</div>
      <div><h3 style="font-size:15px;margin-bottom:6px">결과 평가</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>항목</th><th>점수</th><th>코멘트</th></tr></thead><tbody>${rows(g.result)}</tbody></table></div></div>
      <div><h3 style="font-size:15px;margin-bottom:6px">과정 평가</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>항목</th><th>점수</th><th>코멘트</th></tr></thead><tbody>${rows(g.process)}</tbody></table></div></div>
      <div class="md" style="max-width:none"><h3>잘한 점</h3><ul>${(g.strengths || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ul><h3>개선할 점</h3><ul>${(g.improvements || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>
      ${(g.promptReviews || []).length ? `<div><h3 style="font-size:15px;margin-bottom:6px">프롬프트별 피드백</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Q</th><th>피드백</th><th>개선 예시</th></tr></thead><tbody>${g.promptReviews.map((p) => `<tr><td class="num">Q${p.no}</td><td>${esc(p.comment)}</td><td style="white-space:pre-wrap">${esc(p.better)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
      <details class="guide"><summary>정답 근거 보기</summary>
        <div class="md" style="max-width:none">
          <h3>근본원인</h3><p>${esc(K.rootCause)}</p>
          <h3>핵심 수치</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>항목</th><th>값</th><th>근거</th><th>계산</th></tr></thead><tbody>${K.keyNumbers.map((k) => `<tr><td>${esc(k.label)}</td><td class="num">${esc(k.value)}</td><td>${esc(k.source)}</td><td>${esc(k.calc)}</td></tr>`).join("")}</tbody></table></div>
          <h3>함정과 사실</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>유형</th><th>함정</th><th>사실</th><th>근거</th></tr></thead><tbody>${K.traps.map((t) => `<tr><td>${esc(t.type)}</td><td>${esc(t.trap)}</td><td>${esc(t.truth)}</td><td>${esc(t.evidence)}</td></tr>`).join("")}</tbody></table></div>
          <h3>반드시 인용할 근거</h3><ul>${K.mustCite.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
        </div>
      </details>`;
  }
  async function gradeEssay() {
    if (!sample) return;
    const key = KEY, btns = [$("submitBtn"), $("regradeBtn")];
    btns.forEach((b) => (b.disabled = true));
    renderGrade(null);
    $("resultPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    let g;
    try { g = await sample.json(gradeInput(), { modelTier: "complex", cache: false }); }
    catch (e) { g = { error: e.code === "invalid_json" ? "채점 결과를 읽지 못했습니다. 다시 채점을 눌러 주세요." : e.code === "not_granted" ? "AI 사용 권한이 없어 채점할 수 없습니다." : "채점 요청이 실패했습니다 (" + e.code + "). 다시 채점을 눌러 주세요." }; }
    store.set(key + "grade", g);
    if (key === KEY) { state.grade = g; renderGrade(g); }
    btns.forEach((b) => (b.disabled = false));
  }
  $("submitBtn").onclick = () => (P.type === "mcq" ? gradeMCQ() : gradeEssay());
  $("regradeBtn").onclick = () => (P.type === "mcq" ? mcqFeedback() : gradeEssay());

  /* ---------- 다시 풀기 ---------- */
  $("resetWrap").addEventListener("click", (e) => {
    const id = e.target.id;
    if (id === "resetBtn") $("resetWrap").innerHTML = '<span class="confirm">이 문제의 답안·AI 기록·타이머를 지울까요? <button class="btn sm" id="rsYes" type="button">초기화</button><button class="btn sm ghost" id="rsNo" type="button">취소</button></span>';
    if (id === "rsNo") $("resetWrap").innerHTML = '<button class="btn ghost sm" id="resetBtn" type="button">다시 풀기</button>';
    if (id === "rsYes") {
      ["log", "attached", "grade", "answer", "draft", "mcq"].forEach((k) => store.del(KEY + k));
      store.set(KEY + "startedAt", Date.now());
      $("resetWrap").innerHTML = '<button class="btn ghost sm" id="resetBtn" type="button">다시 풀기</button>';
      open(P.id);
    }
  });

  /* ---------- 문제 전환 ---------- */
  const groups = [...new Set(ALL.map((p) => p.group || "실전 과제"))];
  $("probSel").innerHTML = groups.map((g) => `<optgroup label="${esc(g)}">${ALL.filter((p) => (p.group || "실전 과제") === g).map((p) => `<option value="${esc(p.id)}">[${esc(p.badge)}] ${esc(p.title)}</option>`).join("")}</optgroup>`).join("");
  $("probSel").onchange = (e) => open(e.target.value);
  function open(id) {
    if (busy) ctl?.abort();
    P = ALL.find((p) => p.id === id) || ALL[0];
    KEY = "axlab:" + P.id + ":";
    LIMIT = P.aiLimit || { count: 10, chars: 1000 };
    store.set("axlab:last", P.id);
    $("probSel").value = P.id;
    let startedAt = load("startedAt", null);
    if (!startedAt) { startedAt = Date.now(); save("startedAt", startedAt); }
    state = { log: load("log", []), attached: new Set(load("attached", [])), current: 0, zoom: {}, startedAt, grade: load("grade", null), mcq: load("mcq", { choices: {}, flags: {}, submitted: false }) };
    renderProblem(); renderFileList(); renderViewer(); renderAttach(); renderLog(); renderLeft(); tick();
    prompt.value = load("draft", ""); onPrompt();
    $("resultPanel").hidden = true;
    if (P.type === "mcq") { renderMCQ(); if (state.mcq.submitted) gradeMCQ(); }
    else { ans.value = load("answer", ""); onAnswer(); if (state.grade) renderGrade(state.grade); }
  }
  open(store.get("axlab:last", ALL[0].id));

  (window.claude ? window.claude.use("sample") : Promise.resolve(null)).then(async (s) => {
    sample = s;
    if (!s) {
      disableAI("");
      $("aiOff").innerHTML = 'AI 질문·서술형 채점은 claude.ai 버전에서만 동작합니다. <a href="https://claude.ai/artifact/GHXmjKkiBTeCn27xj9poNN" target="_blank" rel="noopener">claude.ai에서 열기</a> (객관식·주관식 채점은 여기서도 됩니다)';
    }
    else { try { imagesOK = !!(await s.limits()).images; } catch { imagesOK = false; } }
    renderLeft(); renderAttach();
  });
})();
</script>
